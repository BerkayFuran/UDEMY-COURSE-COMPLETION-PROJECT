<style>
    
.jr-Galery{
  background-color: white;
}

.jrtitle h2{
 text-align: center;
 margin-top: 100px;
 font-size: 70px;
 background-color: rgb(238, 238, 238);
font-family: 'Cinzel', serif;
letter-spacing: 2px;
text-transform: uppercase;

 }                
              
.jrH {
 display: flex;
 justify-content: center;
 gap: 40px ;
   }                  
.jrH a {
  font-size: 20px;
  display: inline-block;
  text-transform: uppercase;
  color: black;
  text-decoration: none;
  font-family: 'Cinzel', serif;
  letter-spacing: 2px;
  margin-top: 40px;
}
#Redjunior{
  max-width: 900px;
  margin: auto;
}
#Redjunior h2{
 font-family: 'Cinzel', serif;
  text-transform: uppercase;
  letter-spacing: 4px;
  font-weight: bold;
  font-weight: 700;
  font-size: 20px;
  color: black;
  margin-top: 100px;
  margin-bottom: -70px;

}
#Redjunior img {
  width: 100%;
  margin-top: 80px;
  border-radius: 8px;
}
.red-galery {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 20px;
}
.red-galery img {
    width: 100%;
    height: 280px;
  border-radius: 8px;
  transition: 0.3s;
  object-fit: cover;
}
.red-galery .big {
  grid-column: 1 / 3;
  height: 400px;
}

#Silverjunior img{
max-width: 900px;
margin: auto;
width: 100%;
margin-top: 80px;
border-radius: 8px;
}
.Silver-Gallery img{
  width: 100%;
  height: 280px;
  object-fit: cover;
}
.Silver-Gallery{
  display: grid;
  grid-template-columns:  1fr 1fr;
  gap: 20px;
}
.Silver-Gallery .big{
  grid-column: 1 / 3;
  height: 480px;
}
.Blue-Gallery {
  max-width: 900px;
  margin: auto;
  width: 100%;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}
.Blue-Gallery img{
  width: 100%;
  height: 280px;
  object-fit: cover;
}
.Blue-Gallery .big {
  grid-column: 1 / 3;
  height: 480px;
}
